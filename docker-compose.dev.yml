# Postgres for local development.
#
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/highfield npm run dev
#
# Keeps its data in a named volume, so restarting the container does not wipe
# your local accounts.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: highfield
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - highfield-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d highfield']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  highfield-dev-db:
