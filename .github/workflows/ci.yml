name: CI

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest

    # The suite needs a real database: migrations, unique constraints and
    # transaction rollback are exactly what a fake would not reproduce.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: highfield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The suite runs on Bun, which the runner image does not ship. Without
      # this the Test step fails on `bun: command not found` while typecheck
      # and build, which are plain npm, pass. That is why this job had never
      # been green.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/highfield_test?sslmode=disable
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Build-time page collection touches no database, but the module
          # refuses to load without a connection string.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/highfield_test?sslmode=disable
        run: npm run build
