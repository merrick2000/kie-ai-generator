name: Build & Deploy

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Surfaced as env because the `secrets` context cannot be read from a
    # step-level `if` condition.
    env:
      DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
      DOKPLOY_WEBHOOK_URL_DEV: ${{ secrets.DOKPLOY_WEBHOOK_URL_DEV }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: |
          # GHCR rejects uppercase in repository names.
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/highfield" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.channel }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_HASH=${{ github.sha }}

      # No secrets are baked into the image. Every value is read from the
      # environment the container is started with, so the same artefact is
      # promoted from dev to production unchanged.
      - name: Trigger Dokploy deploy
        if: success() && github.ref_name == 'main' && env.DOKPLOY_WEBHOOK_URL != ''
        run: curl -sf -X POST "$DOKPLOY_WEBHOOK_URL"

      - name: Trigger Dokploy deploy (dev)
        if: success() && github.ref_name == 'dev' && env.DOKPLOY_WEBHOOK_URL_DEV != ''
        run: curl -sf -X POST "$DOKPLOY_WEBHOOK_URL_DEV"

      - name: Report failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::Deploy failed on ${{ github.ref_name }} (${GITHUB_SHA:0:7})"
          echo "See: $RUN_URL"
